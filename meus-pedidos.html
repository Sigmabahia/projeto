    <link rel="stylesheet" href="checkout.css">
    <link rel="preload" as="style" href="extras.css" onload="this.rel='stylesheet'">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"></noscript>

    <meta name="theme-color" content="#0b1f3b">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        .pedidos-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 5% 80px;
        }

        .pedidos-titulo {
            text-align: center;
            margin-bottom: 34px;
        }

        .pedidos-titulo p {
            font-size: 10px;
            letter-spacing: 3px;
            color: #0f4c81;
            margin-bottom: 8px;
        }

        .pedidos-titulo h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            font-weight: 600;
        }

        .pedidos-titulo h1 span {
            color: #d4af37;
        }

        .pedido-card {
            background: #fff;
            border: 1px solid #e3dbc9;
            box-shadow: 0 10px 30px rgba(11, 31, 59, .06);
            margin-bottom: 18px;
        }

        .pedido-topo {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            border-bottom: 1px solid #e3dbc9;
            background: #fdfcf9;
        }

        .pedido-numero {
            font-size: 12px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .pedido-data {
            font-size: 10.5px;
            color: #6b7280;
            margin-top: 3px;
        }

        .pedido-status {
            font-size: 9.5px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fbf6e7;
            color: #8a6d1d;
            border: 1px solid #ecdfb4;
        }

        .pedido-status.pago {
            background: #eef7f1;
            color: #1f7a4d;
            border-color: #cbe6d6;
        }

        .pedido-corpo {
            padding: 18px 22px;
        }

        .pedido-itens {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .pedido-totais {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid #f0ebdd;
        }

        .pedido-totais small {
            display: block;
            font-size: 10px;
            color: #6b7280;
            margin-top: 3px;
        }

        .pedido-totais strong {
            font-size: 16px;
            color: #0b1f3b;
        }

        .pedido-acoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 22px 20px;
        }

        .pedido-acoes button,
        .pedido-acoes a {
            font-size: 9px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 11px 16px;
            border: 1px solid #e3dbc9;
            background: transparent;
            color: #0f4c81;
            cursor: pointer;
            transition: .2s;
            border-radius: 2px;
        }

        .pedido-acoes button:hover,
        .pedido-acoes a:hover {
            border-color: #0b1f3b;
            color: #0b1f3b;
        }

        .vazio-pedidos {
            text-align: center;
            background: #fff;
            border: 1px solid #e3dbc9;
            padding: 60px 24px;
        }

        .vazio-pedidos .icone {
            font-size: 40px;
            margin-bottom: 16px;
        }

        .vazio-pedidos h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .vazio-pedidos p {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 22px;
        }
    </style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>

    <header class="ck-header">

        </a>

        <div class="ck-seguro">
            <span>📦</span>
            <span>Acompanhe suas compras</span>
        </div>

        <a href="paginainicial.html" class="ck-voltar">← Voltar ao site</a>

    </header>


    <main class="pedidos-wrap">

        <div class="pedidos-titulo">
            <p>ROYAL SUITS</p>
            <h1>Meus <span>pedidos</span></h1>
        </div>

        <div id="lista-pedidos"></div>

    </main>


    <footer class="ck-footer">
        <p>
            © 2026 ROYAL SUITS &nbsp;•&nbsp;

            <a href="trocas-e-devolucoes.html">Trocas e devoluções</a>
        </p>
    </footer>

    <script src="meus-pedidos.js" defer></script>
    <script src="extras.js" defer></script>

</body>

</html>
